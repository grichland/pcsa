# Agent settings: every value pcsa uses is set here, and nowhere else. Override one for a single run with
# `--set section.key=value` or the environment variable PCSA__section__key. Unknown or missing keys are rejected.
screen_config: screen.yaml

decide:
  player: cg              # cg: Champions Gym (the section below); first: the first legal action (for tests)

cg:                       # Champions Gym and the player it runs (pcsa.cg)
  transport: subprocess   # subprocess: JSON lines on stdin and stdout; inprocess: a Python entry point
  command: ['{python}', -m, pcsa.cg.serve]  # subprocess: {python} is this environment's interpreter
  entry: null             # inprocess: "package.module:name", a handle(message) callable or a class with .handle
  args: {}                # inprocess: keyword arguments for the entry class
  player: champions_gym.neural:load  # the Session's player; a built-in such as tower needs no player_args
  player_args:            # passed to the player as given; never set allow_mismatch or allow_contract
    policy: pcsa.network.policy:Policy
    checkpoint: assets/models/finetune-20261124-g75-iter-00010.pt  # relative: the repo root
    device: cpu
    policy_args: {threads: 4}  # plus rules, search and choice below
    fallback: tower       # the shell's player when the network fails or is too slow
    timeout_s: 2.0        # a slower answer counts against the network
    hard_timeout_s: 6.0   # an answer this late goes to the fallback
  python_path: []         # directories first on sys.path (inprocess) or in the child's PYTHONPATH; relative: repo root
  env: {}                 # subprocess: extra environment variables (the GPU stays visible for preview_search)
  run_log_dir: cg         # CG's log folder inside the run folder; null: none
  timeout_s: 8.0          # per call, and never past the decision's deadline less the tap reserve
  start_timeout_s: 60.0   # CG is made and its status checked before the first battle
  rules:                  # training's rule masks (pcsa.network.rules); set them as the checkpoint was trained
    enabled: true
    max_same_move: 3      # the same move at most this many turns in a row (0: no limit)
    max_switches: 2       # at most this many voluntary switches in a row (0: no limit)
    max_boosts: 3         # setup moves by the same Pokémon in a row (0: no limit)
    max_heals: 3          # pure recovery moves by the same Pokémon in a row (0: no limit)
    no_null_moves: true   # close damaging moves that do nothing to their active (immunity, Levitate, terrain)
    no_boost_when_ko: true   # close setup, other than Def, Sp. Def or evasion, while their best hit KOs us
    no_failing_status: true   # close status moves that cannot land (already statused, Safeguard, immunity)
    no_redundant_field: true   # close hazards at their maximum and weather or terrain already up
    no_double_protect: true   # close the Protect family two turns in a row
    no_wasted_self: true   # close recovery at full HP, setup at +6, Substitute when it would fail
    status_free_mirrors: [primarina]   # not training's: close status moves when both actives are one of these
    always_mega: true   # not training's: close plain moves while their Mega copy is open, so we always Mega Evolve
    one_mega_lineup: true   # not training's: close team-preview picks that bring two or more Mega stone holders
  search:                 # decision-time search at turn requests (pcsa.network.search)
    enabled: false        # needs Champions Gym 0.5.0 or later (0.7.1 is pinned)
    ms: 1500              # time per turn request; never past the request's deadline less the tap reserve
    worlds: 6             # sampled completions of the opponent's hidden team, one tree each
    depth: 3              # turns looked ahead
    outcomes: 3           # random outcomes drawn per pair of actions
    c: 1.5                # weight of the network's priors in the choice of what to try
    n0: 1                 # weight of the network's matrix cell in each pair's value
    batch: 16             # positions per network call
    min_sims: 64          # fewer simulations than this in total: the network's own answer is played
    sims: 0               # stop after this many simulations (0: by time only)
    seed: 0               # the search's random seed
    top_ours_moves: 0     # at every position only our N likeliest moves by the network's policy, Mega copy included (0: all)
    top_ours_switches: 0  # ... and our N likeliest switches (0: all)
    top_theirs_moves: 3   # at every position only their N likeliest moves by the network's prediction, Mega copy included (0: all)
    top_theirs_switches: 2  # ... and their N likeliest switches (0: all)
    from_turn: 1          # earlier turns of the battle are not searched
    settle_sims: 300      # stop before `ms` once the pick has led this many simulations (0: always use `ms`)
    settle_share: 0.9     # ... and holds this share of the search's strategy
    settle_gap: 0.01      # or once the best two actions are this close in win chance, after twice settle_sims
    follow_pivot: true    # a pivot move picked: its switch-in is the one the search chose for after it
    worlds_mode: builds   # their sets: whole known builds weighted by what the battle showed (legacy: part by part)
  choice:                 # how the pick is made from the network's matrix at turn requests (pcsa.network.choosing)
    rule: regret          # mean: expected score (with top_theirs 0: the network's own pick); min; mix; regret
    top_theirs: 8         # over their N likeliest replies by the network's prediction (0: all)
    top_ours: 8           # among our N likeliest actions by the network's policy (0: all legal)
    blend: 0.5            # mix only: the weight of the mean against the worst case
  value_calibration:      # the value reported as 2 * sigmoid(a * v + b) - 1, fitted per checkpoint
    enabled: true         # by tools/value_calibration.py; off: the raw value
    a: 1.43017            # finetune-20261124-g75-iter-00010 on 251 recorded battles
    b: -0.48124
  preview_search:         # replaces the preview head's pick (pcsa.network.preview_search)
    enabled: true         # off: the head's pick, exactly
    budget_s: 30          # search time; never past the preview deadline less the tap reserve
    guesses: 3            # versions of their team, sets drawn from the belief
    race: [20, 6, 2]      # rows kept at 1/4, 1/2, 3/4 of the budget; the head's pick always kept
    prior_games: 2        # stage A counts as this many games in each cell
    choose: mean          # mean (tested best) or maximin
    keep_head_margin: 0.03   # leave the head's pick only when the best row's mean is this much higher
    device: cuda          # the playouts run on the GPU; the live player stays on the CPU
    threads: 8            # Champions Gym threads
    seed: 0
    worlds_mode: builds   # their sets: whole known builds (legacy: part by part)

device:
  serial: null            # null: the single authorized device
  timeout_s: 15
  stay_awake: true        # svc power stayon usb during runs; previous value restored on exit
  retry:
    attempts: 4           # per ADB call before the session is restarted
    base_s: 0.5           # exponential backoff: base, 2*base, 4*base ... up to max_s
    max_s: 8.0
    reconnect_wait_s: 20  # adb wait-for-device bound after a reconnect

run:
  name: run               # run folder prefix under output/runs
  seed: null              # null: a new random seed; a number repeats choices and taps
  battles: 10             # battles with a decided outcome before the run finishes
  max_battles_total: 12   # bound on battles started, including opponent forfeits
  count_forfeits: false
  max_restarts_per_hour: 20

timing:
  inter_tap_s: 0.5
  post_action_wait_s: 10.0
  poll_interval_s: 1.0    # the longest pause after a screen check
  poll_cycle_s: 2.0       # a screen check starts this long after the one before; a slower check is followed at once
  fight_settle_s: 0.9
  back_settle_s: 0.7
  party_settle_s: 0.9     # a switch: after Pokemon and after Switch In, before the party screen is read
  move_peek: when_needed  # always: look at the move list before every action turn (Fight, read, Back).
                          # when_needed: skip the look (about 3.4 s a turn) and take move names from the team
                          # sheet, PP from the log count and the Mega button from the log; the move row is then
                          # tapped twice. The turn still looks when a move's counted PP is 4 or less, the log
                          # read lost or doubted rows, the last taps did not go through, a Mega chosen last turn
                          # is not in the log, the battle was picked up midway or could not be tracked.
  team_menu_settle_s: 0.8
  log_open_settle_s: 1.2
  log_swipe_settle_s: 0.6
  max_turn_s: 40.0        # from the first action-screen capture to the last tap
  team_budget_s: 45.0     # lineup deadline when the selection timer cannot be read
  no_progress_s: 420      # no tap and no screen change for this long -> session restart
  default_screen_timeout_s: 60
  screen_timeouts:        # seconds on one screen before the session restarts
    matchmaking: 240
    prep: 240
    transition: 150
    wait: 150
    rewards: 90
    result: 90
    forfeit_msg: 90
    unknown: 45
    lobby: 60
    options: 60
    team_select: 100
    action: 120
    forced: 90
    party: 30
    moves: 30
    log: 30
    switch_popup: 30
    rank_up: 120
    rating_dialog: 30
    dialog: 30
    comm_error: 30
    title: 60
    home: 60
    battle_modes: 60
    ranked_formats: 60

log:                      # in-game battle log collection, per turn
  captures_max: 10
  seconds_max: 12.0       # stop scrolling after this; act on what was read
  drag:                   # drag toward older entries; start and end drawn at random inside these ranges
    x: [0.513, 0.684]
    y_start: [0.231, 0.278]
    y_end: [0.833, 0.870]
    steps: 8
    hold_s: 0.35
  paging:                 # heading jumped past turns with no action screen of ours: page back with the arrows
    enabled: true
    settle_s: 0.8         # after an arrow tap, before the heading is read
    step_s: 1.6           # planning: one arrow tap and its heading check
    page_min_s: 4.0       # planning: one missed page (and the least time left to start one)
    seconds_max: 10.0     # climb budget per missed page

taps:
  focused_move_taps: 1    # a focused move row submits on the next tap
  unfocused_move_taps: 2  # first tap focuses, second submits
  focused_party_taps: 1
  unfocused_party_taps: 2

navigator:
  unknown_wait_s: 5.0
  unknown_max_rounds: 6
  edge_settle_s: 1.5
  max_taps_per_edge: 3
  # Disconnect during a battle: while a battle is in progress and the phone shows an unknown screen, a
  # communication error, a dialog or a long blank/loading frame, tap the screen centre (or an OCR-confirmed
  # OK / Close / Continue / Cancel / Not now) once per round until a battle, post-battle or lobby screen returns.
  disconnect_max_taps: 40     # rounds (taps, or skipped taps when forbidden text is under the centre) before restart
  disconnect_max_s: 180.0     # seconds of the whole ride-out before the session restarts
  disconnect_settle_s: 3.0    # wait after each round before observing again
  disconnect_blank_s: 45.0    # a transition (black/loading) frame mid-battle counts as a disconnect after this long

degrade:
  tap_reserve_s: 2.5
  decide_reserve_s: 3.0
  peek_attempts: 2

ocr:
  det_model: ch_PP-OCRv5_det_mobile.onnx
  rec_model: en_PP-OCRv5_rec_mobile.onnx
  det_limit_side_len: 736
  det_limit_type: min     # max: the long side is shrunk to the limit
  threads: 8              # a whole frame is read in about 1.8 s
  min_confidence: 0.80
