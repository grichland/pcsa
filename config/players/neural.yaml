# Live player from 12 Nov 2026 (user's decision after the pcsa-belief trial): the belief network
# (poke-transformer-belief100, belief+mega columns) with the matrix blend at 4.0, opponent_temperature 1.0 and
# opponent_top 0 (all), the setting research measured (+2 points vs gold940 in the simulator).
# Back to the previous live player: --set policy.neural=players/neural-gold940.yaml
# The neural player (`--player neural`, live and sim): a poke-singles-former checkpoint from the research runs
# (research/pcsa-rl, network code in src/pcsa/rl_training). Needs torch: `uv sync --extra train`.
# Point a run at another network without editing this file: --set policy.neural_checkpoint=<path>
# (or the environment variable PCSA__policy__neural_checkpoint=<path>).
checkpoint: assets/models/poke-transformer-belief100-20261112-1905.pt  # v2-belief update 100 (belief+mega columns, from gold940), opponent head fit to live games; relative to the repo (or to $PCSA_NETWORKS when the file is there), or absolute
device: cpu
sampling: greedy                # greedy: the most likely action; sample: training's capped (0.99) distribution
temperature: 1.0                # of `sample`
opponent_temperature: 1.0         # how much to trust the prediction of their action when weighing our options:
                                # above 1 hedges against their less likely actions, below 1 trusts the favourite
                                # more; 1 = as trained. Changes the action played, also under greedy.
                                # 1.0 here: this network's opponent head was fine-tuned on the live games (top-1
                                # 71%, mean probability on their real action 0.50), so it is not overconfident
                                # the way the old head was (48% sure, 38% right, which 1.3 corrected).
preview: critic                 # critic: training's softmax(value / 0.1), top-p 0.9 nucleus; greedy: the best value
fallback: disciplined           # decides when the network cannot: no or bad checkpoint, no Battle, an error, too slow
opponent_top: 0                 # weigh our options against only their k likeliest actions (0 = all of them, as
                                # trained; the setting research's matrix-blend comparison used).
max_decision_s: 5.0             # a decision (or team preview) taking longer than this goes to the fallback
reserve_s: 0.5                  # deadline time kept for the fallback
threads: 1                      # torch CPU threads
seed: null                      # preview and `sample` draws; null: fresh each run
# Guard rules: stop plainly wasted actions; the network's best other action is played instead ([] = the network
# alone; one run: --set policy.neural_rules=none, or names separated by commas). See src/pcsa/players/neural_rules.py.
rules: [no_full_heal, useless_status, locked_futile, priority_ko]
# Feature mode: which observation columns the network reads. checkpoint (default): the mode the network was trained
# with (its run config's `features`; none = base, as every network before the belief tracker, gold940 included).
# base | belief | belief+mega force one; a base network refuses the belief modes. In the belief modes the player
# keeps a belief tracker per battle (src/pcsa/belief/README.md). One run: --set policy.neural_checkpoint=<belief
# network> is enough, the mode follows it.
features: checkpoint
belief_crit_lines: false        # belief modes: the protocol prints critical hits (true only for simulator runs;
                                # the phone's battle log does not, so any hit may have been one)
matrix_blend: 4.0               # stage 3 (research/pcsa-belief): logits + matrix_blend x a one-turn value per action from
                                # the belief's damage calculator (src/pcsa/rl_training/matrix.py); 0 = off, the network
                                # alone. Research's +2 points vs gold940 were at 4.0 (simulator); live from
                                # 12 Nov with the belief network (neural.yaml); neural-gold940.yaml is the rollback.
