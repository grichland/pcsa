name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Champions Gym ships a Windows wheel only: on Linux it is not installed and its tests skip.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --extra torch
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest
