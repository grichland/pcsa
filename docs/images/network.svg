<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>pcsa neural player: policy/value network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="theirs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="pol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="val" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="660" rx="22" fill="url(#bg)"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#f8fafc">The neural player's network</text>
  <text x="40" y="80" font-size="14.5" fill="#a5b4fc">One forward pass per decision · policy (which of 11 actions) and value (how good the position is) · size S: 1.6 M parameters</text>

  <!-- column headings -->
  <g font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
    <text x="40" y="120">1 · WHAT IT SEES</text>
    <text x="350" y="120">2 · ENCODE EACH PART</text>
    <text x="620" y="120">3 · ATTEND OVER THE BATTLE</text>
    <text x="940" y="120">4 · DECIDE</text>
  </g>

  <!-- 1: inputs -->
  <g filter="url(#shadow)">
    <rect x="40" y="136" width="270" height="170" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="40" y="136" width="270" height="34" rx="14" fill="url(#ours)"/>
    <rect x="40" y="156" width="270" height="14" fill="url(#ours)"/>
    <text x="56" y="159" font-size="15" font-weight="700" fill="#fff">Our 6 Pokémon</text>
    <text x="56" y="194" font-size="13" fill="#e2e8f0">active · 2 brought · 3 left at home</text>
    <text x="56" y="218" font-size="13" fill="#cbd5e1">318 numbers each: HP, status, boosts,</text>
    <text x="56" y="236" font-size="13" fill="#cbd5e1">stats, speed and damage both ways,</text>
    <text x="56" y="254" font-size="13" fill="#cbd5e1">move facts, PP, Mega, what it did</text>
    <text x="56" y="282" font-size="13" fill="#93c5fd">+ species · item · ability · 4 moves</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="322" width="270" height="170" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="40" y="322" width="270" height="34" rx="14" fill="url(#theirs)"/>
    <rect x="40" y="342" width="270" height="14" fill="url(#theirs)"/>
    <text x="56" y="345" font-size="15" font-weight="700" fill="#fff">Their 6 Pokémon</text>
    <text x="56" y="380" font-size="13" fill="#e2e8f0">active · 2 seen · 3 only in preview</text>
    <text x="56" y="404" font-size="13" fill="#cbd5e1">the same 318 numbers, with their set</text>
    <text x="56" y="422" font-size="13" fill="#cbd5e1">assumed from top usage and corrected</text>
    <text x="56" y="440" font-size="13" fill="#cbd5e1">by what the battle has revealed</text>
    <text x="56" y="468" font-size="13" fill="#fca5a5">+ species · item · ability · 4 moves</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="508" width="270" height="118" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="40" y="508" width="270" height="34" rx="14" fill="url(#field)"/>
    <rect x="40" y="528" width="270" height="14" fill="url(#field)"/>
    <text x="56" y="531" font-size="15" font-weight="700" fill="#fff">The field</text>
    <text x="56" y="566" font-size="13" fill="#cbd5e1">126 numbers: turn, weather, terrain,</text>
    <text x="56" y="584" font-size="13" fill="#cbd5e1">hazards and screens, last turn,</text>
    <text x="56" y="602" font-size="13" fill="#cbd5e1">their tendencies, threat summary</text>
  </g>

  <!-- arrows 1 -> 2 -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M312 221 L346 221"/>
    <path d="M312 407 L346 407"/>
    <path d="M312 567 L346 567"/>
  </g>

  <!-- 2: encoders -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="240" height="140" rx="14" fill="#1e293b" stroke="#64748b"/>
    <text x="366" y="178" font-size="15" font-weight="700" fill="#f1f5f9">Embeddings</text>
    <text x="366" y="200" font-size="13" fill="#cbd5e1">species 32 · item 16 · ability 16</text>
    <text x="366" y="218" font-size="13" fill="#cbd5e1">4 moves × 16</text>
    <text x="366" y="246" font-size="15" font-weight="700" fill="#f1f5f9">Pokémon encoder</text>
    <text x="366" y="268" font-size="13" fill="#cbd5e1">MLP 446 → 512 → 256 → d</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="336" width="240" height="140" rx="14" fill="#1e293b" stroke="#64748b"/>
    <text x="366" y="364" font-size="15" font-weight="700" fill="#f1f5f9">Same encoder, shared</text>
    <text x="366" y="386" font-size="13" fill="#cbd5e1">one token per Pokémon: 12</text>
    <text x="366" y="414" font-size="15" font-weight="700" fill="#f1f5f9">+ token-type embedding</text>
    <text x="366" y="436" font-size="13" fill="#cbd5e1">which seat / role each row is</text>
    <text x="366" y="456" font-size="13" fill="#cbd5e1">+ decision-position embedding</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="508" width="240" height="118" rx="14" fill="#1e293b" stroke="#64748b"/>
    <text x="366" y="536" font-size="15" font-weight="700" fill="#f1f5f9">Field encoder</text>
    <text x="366" y="558" font-size="13" fill="#cbd5e1">MLP 126 → 256 → d</text>
    <text x="366" y="586" font-size="13" fill="#cbd5e1">one field token</text>
    <text x="366" y="606" font-size="13" fill="#86efac">13 tokens per decision</text>
  </g>

  <!-- token strip -->
  <g>
    <text x="620" y="152" font-size="13" fill="#cbd5e1">The last 16 decisions of this battle, 13 tokens each</text>
    <g>
      <rect x="620" y="164" width="290" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
      <g>
        <rect x="628" y="171" width="16" height="16" rx="3" fill="#10b981"/>
        <rect x="648" y="171" width="16" height="16" rx="3" fill="#3b82f6"/>
        <rect x="668" y="171" width="16" height="16" rx="3" fill="#3b82f6" opacity="0.8"/>
        <rect x="688" y="171" width="16" height="16" rx="3" fill="#3b82f6" opacity="0.6"/>
        <rect x="708" y="171" width="16" height="16" rx="3" fill="#ef4444"/>
        <rect x="728" y="171" width="16" height="16" rx="3" fill="#ef4444" opacity="0.8"/>
        <rect x="748" y="171" width="16" height="16" rx="3" fill="#ef4444" opacity="0.6"/>
        <text x="772" y="184" font-size="12" fill="#94a3b8">… turn t−15 … t−1</text>
        <rect x="874" y="171" width="16" height="16" rx="3" fill="#fbbf24"/>
        <text x="894" y="184" font-size="12" fill="#fde68a">t</text>
      </g>
    </g>
  </g>
  <g stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M592 400 C 605 400, 606 300, 616 300"/>
    <path d="M592 220 C 606 220, 606 260, 616 270"/>
    <path d="M592 567 C 606 567, 606 360, 616 340"/>
  </g>

  <!-- 3: transformer -->
  <g filter="url(#shadow)">
    <rect x="620" y="210" width="290" height="300" rx="16" fill="url(#tf)"/>
    <text x="640" y="244" font-size="17" font-weight="700" fill="#fff">Transformer</text>
    <text x="640" y="266" font-size="13" fill="#ddd6fe">block-causal: a decision sees itself</text>
    <text x="640" y="283" font-size="13" fill="#ddd6fe">and the earlier ones, never later ones</text>
    <g font-size="13" fill="#f5f3ff">
      <rect x="640" y="300" width="250" height="32" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <text x="656" y="321">self-attention · pre-norm</text>
      <rect x="640" y="340" width="250" height="32" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <text x="656" y="361">SwiGLU feed-forward</text>
      <text x="656" y="398" font-size="22" font-weight="700" fill="#fff">× layers</text>
    </g>
    <g font-size="13" fill="#ede9fe">
      <text x="640" y="436">S: d 64 · 4 layers · 4 heads (in use)</text>
      <text x="640" y="456">M: d 192 · 6 layers · 6 heads</text>
      <text x="640" y="476">L: d 256 · 8 layers · 8 heads</text>
      <text x="640" y="496" fill="#c4b5fd">final LayerNorm</text>
    </g>
  </g>
  <text x="620" y="540" font-size="13" fill="#94a3b8">The current decision's 13 output tokens</text>
  <text x="620" y="558" font-size="13" fill="#94a3b8">are flattened (13 × d) and read out twice.</text>

  <g stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M912 300 C 925 300, 925 215, 936 215"/>
    <path d="M912 420 C 925 420, 925 470, 936 470"/>
  </g>

  <!-- 4: heads -->
  <g filter="url(#shadow)">
    <rect x="940" y="136" width="220" height="230" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="940" y="136" width="220" height="34" rx="14" fill="url(#pol)"/>
    <rect x="940" y="156" width="220" height="14" fill="url(#pol)"/>
    <text x="956" y="159" font-size="15" font-weight="700" fill="#1c1917">Policy head</text>
    <text x="956" y="194" font-size="13" fill="#cbd5e1">MLP → 512 → 11 actions</text>
    <g font-size="12.5" fill="#fde68a">
      <rect x="956" y="206" width="188" height="24" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="966" y="223">4 moves</text>
      <rect x="956" y="234" width="188" height="24" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="966" y="251">4 moves + Mega Evolve</text>
      <rect x="956" y="262" width="188" height="24" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="966" y="279">3 switches</text>
    </g>
    <text x="956" y="310" font-size="13" fill="#cbd5e1">illegal actions masked out;</text>
    <text x="956" y="328" font-size="13" fill="#cbd5e1">no action above 99%</text>
    <text x="956" y="350" font-size="13" fill="#fbbf24" font-weight="700">→ the move it plays</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="940" y="390" width="220" height="236" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="940" y="390" width="220" height="34" rx="14" fill="url(#val)"/>
    <rect x="940" y="410" width="220" height="14" fill="url(#val)"/>
    <text x="956" y="413" font-size="15" font-weight="700" fill="#082f49">Value head</text>
    <text x="956" y="448" font-size="13" fill="#cbd5e1">MLP → 512 → 1</text>
    <text x="956" y="474" font-size="13" fill="#cbd5e1">expected reward from here:</text>
    <text x="956" y="492" font-size="13" fill="#cbd5e1">+1 win / −1 loss, ±0.1 a faint</text>
    <!-- value bar -->
    <rect x="956" y="508" width="188" height="10" rx="5" fill="#334155"/>
    <rect x="1050" y="508" width="70" height="10" rx="5" fill="#22d3ee"/>
    <line x1="1050" y1="503" x2="1050" y2="523" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="956" y="536" font-size="11" fill="#94a3b8">−1</text>
    <text x="1046" y="536" font-size="11" fill="#94a3b8">0</text>
    <text x="1136" y="536" font-size="11" fill="#94a3b8">+1</text>
    <text x="956" y="566" font-size="13" fill="#67e8f9" font-weight="700">→ team preview:</text>
    <text x="956" y="584" font-size="13" fill="#cbd5e1">scores all 60 lead + two picks,</text>
    <text x="956" y="602" font-size="13" fill="#cbd5e1">samples from the best (top-p 0.9)</text>
  </g>

  <text x="1160" y="650" text-anchor="end" font-size="11" fill="#64748b">trained by PPO (research/pcsa-rl) · inference in src/pcsa/rl_training</text>
</svg>
